---
- name: Listen for events on a webhook
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Say Hello
      condition: event.payload.message == "Testing webhook2"
      action:
        run_workflow_template:
          name: clear_data_workflow
          organization: VSI
          job_args:
            extra_vars:
              dir_path: "some path"
