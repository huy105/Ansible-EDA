# curl -H "Content-type: application/json" -d '{"message":"Testing webhook"}' 10.128.2.67:5000/endpoint
# curl -H 'Content-type: application/json' -d "{\"message\":\"Testing webhook\", \"clear_path\":\"/home/huylg/example\"}" 10.130.3.90:5000/endpoint